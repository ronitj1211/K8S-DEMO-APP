apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-ui
  template:
    metadata:
      labels:
        app: notes-ui
    spec:
      containers:
        - name: ui
          image: pv-demo-ui:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: notes-ui
spec:
  type: NodePort
  selector:
    app: notes-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30096
