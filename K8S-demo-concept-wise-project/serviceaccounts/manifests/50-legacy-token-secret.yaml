# LEGACY long-lived token — how this used to work, and why it changed.
#
# Before Kubernetes 1.24, creating a ServiceAccount automatically created a
# Secret of type kubernetes.io/service-account-token containing a token that:
#   * never expired
#   * was not bound to any Pod
#   * remained valid after the Pod, and even the ServiceAccount, was deleted
#   * was readable by anyone with `get secrets` in the namespace
#
# In 1.24 that auto-creation was REMOVED (KEP-1205). In 1.29+ the legacy
# tokens are also auto-cleaned when unused. You can still create one by
# hand, and there is exactly one legitimate reason: an external client that
# cannot use the TokenRequest API — for example a long-lived CI system or a
# monitoring tool outside the cluster.
#
# Prefer, in this order:
#   1. Workload identity federation (IRSA / GKE WI / Azure WI) — no token at all
#   2. `kubectl create token <sa> --duration=1h` — short-lived, on demand
#   3. This, only if neither is possible. Rotate it and audit who can read it.
apiVersion: v1
kind: Secret
metadata:
  name: sa-pod-reader-legacy-token
  namespace: identity
  annotations:
    # This annotation is what makes the controller populate the token.
    kubernetes.io/service-account.name: sa-pod-reader
type: kubernetes.io/service-account-token
