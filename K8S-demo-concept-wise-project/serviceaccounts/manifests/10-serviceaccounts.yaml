# Four ServiceAccounts, each demonstrating one behaviour.
#
# A ServiceAccount is just an IDENTITY. On its own it grants NOTHING —
# permissions come only from a RoleBinding or ClusterRoleBinding that
# names it as a subject. Creating an SA is not a security decision;
# binding it is.
---
# 1. No permissions at all. Used to show what a token without RBAC can do
#    (answer: authenticate successfully, then get 403 on everything).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-nothing
  namespace: identity
---
# 2. Will be bound to a namespaced Role granting pod read access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-pod-reader
  namespace: identity
---
# 3. Will be bound to a ClusterRole — permissions across ALL namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-cluster-viewer
  namespace: identity
---
# 4. Token mounting DISABLED at the ServiceAccount level.
#    Every Pod using this SA gets no token unless it explicitly opts back
#    in with automountServiceAccountToken: true on the Pod spec.
#
#    This should be the default posture: most application Pods never call
#    the Kubernetes API, so mounting a credential into them is pure risk.
#    An attacker with RCE in your container reads the token first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-no-token
  namespace: identity
automountServiceAccountToken: false
---
# 5. An SA carrying imagePullSecrets. Any Pod using this SA inherits them
#    automatically — you don't repeat imagePullSecrets on every Deployment.
#    This is the cleanest way to distribute registry credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-with-pull-secret
  namespace: identity
imagePullSecrets:
  - name: registry-creds        # the Secret must exist for Pods to start cleanly
