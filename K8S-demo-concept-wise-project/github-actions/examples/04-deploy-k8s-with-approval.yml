# Deploy to Kubernetes with manual approval via environment protection.
# Assumes an image was pushed to GHCR by an earlier workflow.
name: Deploy

on:
  workflow_run:
    workflows: [Build & Push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (short SHA) to deploy'
        required: true
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        run: |
          set -euxo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          kubectl set image deployment/backend backend="$IMAGE"
          kubectl rollout status deployment/backend --timeout=180s

      - name: Verify version
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          for i in {1..10}; do
            OUT=$(kubectl exec deployment/backend -- wget -qO- http://localhost:3000/ 2>/dev/null || true)
            if echo "$OUT" | grep -q "$IMAGE_TAG"; then
              echo "verified: response contains expected tag"
              exit 0
            fi
            echo "attempt $i/10: not yet"
            sleep 3
          done
          echo "::error::deploy verification failed"
          exit 1
