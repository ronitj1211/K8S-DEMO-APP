# Matrix build across multiple Node versions and OSes.
# Total = 3 x 3 = 9 parallel jobs.
name: Matrix Test

on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false                    # don't stop other combos on one failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - os: windows-latest             # skip a specific combo if too costly
            node: 18
        include:
          - os: ubuntu-latest              # add a one-off combination
            node: 21
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
