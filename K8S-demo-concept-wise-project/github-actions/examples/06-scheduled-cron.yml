# Scheduled workflow — cron trigger + manual dispatch.
# Common use: nightly backups, dependency updates, health probes.
name: Nightly Backup

on:
  schedule:
    - cron: '0 2 * * *'         # 02:00 UTC every day
  workflow_dispatch:              # allow manual runs

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gh-backup
          aws-region: us-east-1

      - name: Dump DB and upload to S3
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euxo pipefail
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          PGPASSWORD="$DB_PASSWORD" pg_dump -h "$DB_HOST" -U app db > "backup-$TIMESTAMP.sql"
          gzip "backup-$TIMESTAMP.sql"
          aws s3 cp "backup-$TIMESTAMP.sql.gz" "s3://my-backups/postgres/"

      - name: Notify on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: 'Nightly backup failed'
          SLACK_COLOR: 'danger'

# Notes:
# - Cron timezone is UTC. `0 2 * * *` = 02:00 UTC.
# - GitHub delays cron by up to ~15 min under load.
# - Cron only fires from the default branch.
# - Inactive repos (60+ days) stop firing until you push a commit.
