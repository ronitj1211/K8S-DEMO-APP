# A reusable workflow — invoked from other workflows via `uses:`.
# Save at .github/workflows/reusable-deploy.yml
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      KUBE_CONFIG_B64:
        required: true
    outputs:
      deployed_image:
        description: 'Full image reference deployed'
        value: ${{ jobs.deploy.outputs.image }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.set.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Deploy
        id: set
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
          kubectl set image deployment/backend backend="$IMAGE"
          kubectl rollout status deployment/backend --timeout=180s
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

