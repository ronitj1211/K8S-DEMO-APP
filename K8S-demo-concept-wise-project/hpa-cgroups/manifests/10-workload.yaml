# The main workload. Deliberately given a TIGHT CPU limit (500m) and a
# modest memory limit (128Mi) so both throttling and OOMKills are easy to
# provoke on purpose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-lab
  namespace: loadlab
  labels:
    app: load-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-lab
  template:
    metadata:
      labels:
        app: load-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: load-lab
          image: load-lab:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            # requests -> what the SCHEDULER reserves. HPA percentages are
            # computed against this number, not against the limit.
            requests:
              cpu: 200m
              memory: 64Mi
            # limits -> what the KERNEL enforces via cgroups.
            #   cpu 500m    -> cpu.max = "50000 100000" (50ms of every 100ms)
            #   memory 128Mi-> memory.max = 134217728, exceed it and you're
            #                  SIGKILLed with exit code 137
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: load-lab
  namespace: loadlab
  labels:
    app: load-lab
spec:
  type: NodePort
  selector:
    app: load-lab
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30400
