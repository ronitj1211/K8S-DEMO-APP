apiVersion: v1
kind: Pod
metadata:
  name: backend-with-sidecar
  labels:
    app: backend
    variant: multi-container
spec:
  volumes:
    - name: logs
      emptyDir: {}

  containers:
    - name: backend
      image: k8s-demo-backend:1.0
      ports:
        - containerPort: 3000
      volumeMounts:
        - name: logs
          mountPath: /var/log/app

    - name: log-sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo "Hello from Sidecar" > /www/index.html
          httpd -f -p 8090 -h /www
      ports:
        - containerPort: 8090
      volumeMounts:
        - name: logs
          mountPath: /var/log/app