# Grafana "provisioning" = declaring datasources and dashboards as files on
# disk instead of clicking them into the UI. Anything created through the UI
# lives only in Grafana's database and is lost when the pod is replaced —
# provisioning is what makes a Grafana install reproducible and GitOps-able.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  # Mounted at /etc/grafana/provisioning/datasources/
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy          # Grafana's backend queries Prometheus, not the browser
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        jsonData:
          timeInterval: 15s    # should match Prometheus scrape_interval
          httpMethod: POST

      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager.monitoring.svc:9093
        jsonData:
          implementation: prometheus

  # Mounted at /etc/grafana/provisioning/dashboards/
  # Tells Grafana to load every dashboard JSON found in the given path.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Demo
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
