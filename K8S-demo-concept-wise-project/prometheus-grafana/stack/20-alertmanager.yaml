apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # The routing tree. An alert enters at the root and walks down until it
    # matches a child route; `continue: false` (default) stops at the first match.
    route:
      receiver: default-webhook
      group_by: ['alertname', 'namespace']   # one notification per group...
      group_wait: 10s        # ...wait this long to collect more of the group
      group_interval: 30s    # then this long before sending an UPDATED group
      repeat_interval: 1h    # and this long before re-sending an unchanged one
      routes:
        # Critical alerts would page. Here they hit the same webhook but with
        # a tighter repeat interval so you can see routing actually working.
        - matchers:
            - severity = "critical"
          receiver: critical-webhook
          group_wait: 0s
          repeat_interval: 15m

    # Stop a symptom alert from paging when the cause alert is already firing.
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: ['alertname', 'namespace']

    receivers:
      # The demo app logs whatever it receives at POST /alerts, so you can
      # watch the full pipeline with: kubectl logs -n demo -l app=demo-api -f
      - name: default-webhook
        webhook_configs:
          - url: http://demo-api.demo.svc:3000/alerts
            send_resolved: true

      - name: critical-webhook
        webhook_configs:
          - url: http://demo-api.demo.svc:3000/alerts
            send_resolved: true

      # In production you would add something like:
      # - name: pagerduty
      #   pagerduty_configs:
      #     - routing_key: <key>
      # - name: slack
      #   slack_configs:
      #     - api_url: <webhook>
      #       channel: '#alerts'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      nodePort: 30093
